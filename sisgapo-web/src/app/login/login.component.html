<div class="login-layout">

    <div class="panel panel-marca">

        <div class="containerWave" aria-hidden="true">
            <svg viewBox="0 0 720 273" fill="none" preserveAspectRatio="none">
                <path
                    d="M720 201.808C503.169 2.83378e-05 216.788 423.789 7.97251e-07 211.958L1.93272e-05 5.17289e-07L718.792 6.33561e-05L720 201.808Z"
                    style=" fill: #3F51B5;"></path>
            </svg>
        </div>

        <div class="panel-contenido">
            <span class="txtLogo">SISGAPO</span>

            <div class="imgLogo">
                <img src="./../../assets/Logo.svg" alt="Logotipo de SISGAPO" />
            </div>
        </div>

        <div class="containerWaveBottomLeft" aria-hidden="true">
            <svg viewBox="0 0 500 150" preserveAspectRatio="none">
                <path d="M-2.93,75.29 C150.00,150.00 349.20,-49.99 615.41,59.70 L500.00,150.00 L-6.21,150.89 Z"
                    style="stroke: none; fill: #3F51B5;"></path>
            </svg>
        </div>

    </div>

    <div class="panel panel-acceso">

        <div class="panel-contenido">

            <span class="txtBienvenido">Bienvenido</span>

            <div class="imgLogin">
                <img src="./../../assets/login.svg" alt="" aria-hidden="true" />
            </div>

            <form class="formLogin" (ngSubmit)="fnLogin()">

                <mat-form-field class="campo">
                    <mat-label>Usuario</mat-label>
                    <input matInput type="text" [formControl]="sUser" autocomplete="username" name="usuario">
                </mat-form-field>

                <mat-form-field class="campo">
                    <mat-label>Contraseña</mat-label>
                    <input matInput type="password" [formControl]="sPassword" autocomplete="current-password"
                        name="contrasenia">
                </mat-form-field>

                <button type="submit" color="primary" class="btnIngresar" mat-raised-button>Ingresar</button>

            </form>

        </div>

        <div class="containerWaveBottomRight" aria-hidden="true">
            <svg viewBox="0 0 711 215" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g clip-path="url(#clip0)">
                    <path
                        d="M221.324 219.945C349.996 72.8276 476.231 269.438 716.598 -7.76868L717 215L428.494 224.188L221.324 219.945Z"
                        fill="#3F51B5" />
                </g>
                <defs>
                    <clipPath id="clip0">
                        <rect width="717" height="215" fill="white" />
                    </clipPath>
                </defs>
            </svg>
        </div>

    </div>

</div>
