<section class="pagina-contenido" aria-labelledby="tituloUsuarios">
<div class="header-app">
    <h1 id="tituloUsuarios">{{appName}}</h1>
</div>

<button class="fab-listado" mat-mini-fab color="primary" matTooltip="Agregar usuario"
    matTooltipPosition="left" aria-label="Agregar usuario" (click)="fnAbrirModal(0,0)"
    *ngIf="!configuracionService.bDemoSoloLectura">
    <mat-icon>add</mat-icon>
</button>

<div class="barra-filtros row">
    <div class="col-md-5">
        <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>
            <input matInput type="text" [formControl]="fNombre">
        </mat-form-field>
    </div>
    <div class="col-md-2">
        <mat-form-field appearance="outline">
            <mat-label>Rol</mat-label>
            <mat-select [formControl]="fRol">
                <mat-option *ngFor="let opc of lRoles" [value]="opc.valor">{{opc.nombre}}</mat-option>
            </mat-select>
        </mat-form-field>
    </div>
    <div class="col-md-2">
        <mat-form-field appearance="outline">
            <mat-label>Estado</mat-label>
            <mat-select [formControl]="fEstado">
                <mat-option *ngFor="let opc of lEstados" [value]="opc.valor">{{opc.nombre}}</mat-option>
            </mat-select>
        </mat-form-field>
    </div>
    <div class="col-md-3 barra-filtros-botones">
        <button class="boton-limpiar" mat-stroked-button type="button" (click)="fnLimpiarFiltros()">
            <mat-icon>filter_alt_off</mat-icon>
            Limpiar
        </button>
    </div>
</div>

<div class="mat-elevation-z8">
    <div class="tabla-scroll tabla-6col tabla-tarjetas">
        <table mat-table [dataSource]="dsUsuarios" matSort aria-describedby="tituloUsuarios">
            <ng-container matColumnDef="nIdUsuario">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
                <td mat-cell *matCellDef="let element" data-label="Código">{{element.nIdUsuario}}</td>
            </ng-container>
            <ng-container matColumnDef="sNombrePersona">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
                <td mat-cell *matCellDef="let element" data-label="Nombre">{{element.sNombrePersona}}</td>
            </ng-container>
            <ng-container matColumnDef="sNombreUsuario">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
                <td mat-cell *matCellDef="let element" data-label="Usuario">{{element.sNombreUsuario}}</td>
            </ng-container>
            <ng-container matColumnDef="sNombreRol">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
                <td mat-cell *matCellDef="let element" data-label="Rol">{{element.sNombreRol}}</td>
            </ng-container>
            <ng-container matColumnDef="sEstado">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
                <td mat-cell *matCellDef="let element" data-label="Estado">
                    <span class="estado-registro" [class.estado-registro-inactivo]="element.sEstado === 'Inactivo'">
                        {{element.sEstado}}
                    </span>
                </td>
            </ng-container>
            <ng-container matColumnDef="Acciones">
                <th mat-header-cell *matHeaderCellDef class="col-acciones">Acciones</th>
                <td mat-cell *matCellDef="let element" class="col-acciones">
                    <div class="acciones" *ngIf="element.nIdUsuario!=1 && !configuracionService.bDemoSoloLectura">
                        <button mat-raised-button color="accent" (click)="fnAbrirModal(1,element.nIdUsuario)">Editar</button>
                        <button *ngIf="element.sEstado=='Activo'" mat-raised-button color="warn"
                            (click)="fnCambiarEstado(element.nIdUsuario,0)">Desactivar</button>
                        <button *ngIf="element.sEstado=='Inactivo'" mat-raised-button class="boton-activar"
                            (click)="fnCambiarEstado(element.nIdUsuario,1)">Activar</button>
                    </div>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 25, 100]"></mat-paginator>
</div>
</section>
