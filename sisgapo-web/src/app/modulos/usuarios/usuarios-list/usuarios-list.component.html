<div class="header-app" style="margin-top:1rem;">
    <h1 style=" font-weight: bold;">Gestión de {{appName}}</h1>
</div>

<div class="filtros">

    <div class="col-md-5">
        <mat-form-field class="example-form-field inputNombre">

            <mat-label>Nombre</mat-label>

            <input matInput type="text" [formControl]="fNombre">
            <button mat-button *ngIf="fNombre.value" matSuffix mat-icon-button aria-label="Clear">
                <mat-icon>close</mat-icon>
            </button>
        </mat-form-field>
    </div>


    <div class="col-md-2">

        <mat-form-field class="selectEstado" appearance="fill">
            <mat-label>Rol</mat-label>
            <mat-select [formControl]="fRol">
                <mat-option *ngFor="let opc of lRoles" [value]="opc.valor">
                    {{opc.nombre}}
                </mat-option>
            </mat-select>
        </mat-form-field>

    </div>


    <div class="col-md-2">
        <mat-form-field class="selectEstado" appearance="fill">
            <mat-label>Estado</mat-label>
            <mat-select [formControl]="fEstado">
                <mat-option *ngFor="let opc of lEstados" [value]="opc.valor">
                    {{opc.nombre}}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <div class="col-md-2">
        <div class="example-button-row botones ">

            <button mat-raised-button (click)="fnFiltrarUsuarios()">Consultar</button>

            <button mat-raised-button color="primary" (click)="fnAbrirModal(0,0)">Agregar</button>

        </div>
    </div>

</div>



<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

    <!-- Codigo -->
    <ng-container matColumnDef="nIdUsuario">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaId"> Codigo </th>
        <td mat-cell *matCellDef="let element"> {{element.nIdUsuario}} </td>
    </ng-container>

    <!-- Nombre -->
    <ng-container matColumnDef="sNombrePersona">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaUsuario"> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.sNombrePersona}} </td>
    </ng-container>

    <!-- Nombre -->
    <ng-container matColumnDef="sNombreUsuario">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaUsuario"> Usuario </th>
        <td mat-cell *matCellDef="let element"> {{element.sNombreUsuario}} </td>
    </ng-container>

    <!-- Rol -->
    <ng-container matColumnDef="sNombreRol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaId"> Rol </th>
        <td mat-cell *matCellDef="let element"> {{element.sNombreRol}} </td>
    </ng-container>

    <!-- Estado -->
    <ng-container matColumnDef="sEstado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaId"> Estado </th>
        <td mat-cell *matCellDef="let element"> {{element.sEstado}} </td>
    </ng-container>

    <ng-container matColumnDef="Acciones">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaId"> Acciones </th>
        <td mat-cell *matCellDef="let element">
            <div class="example-button-row " *ngIf="element.nIdUsuario!=1">
                <button mat-raised-button color="accent" style="margin-right: 8px;"
                    (click)="fnAbrirModal(1,element.nIdUsuario)">Editar</button>
                <button mat-raised-button color="warn" (click)="fnEliminar(element.nIdUsuario)">Eliminar</button>
            </div>

        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
