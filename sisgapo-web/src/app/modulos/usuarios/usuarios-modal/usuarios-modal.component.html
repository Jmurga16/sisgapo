<div>

    <h1 mat-dialog-title class="clstitulo">{{sAccionModal}} Usuario</h1>


    <form [formGroup]="formUsuario" ngNativeValidate autocomplete="off">
        <ng-template matStepLabel>Puesto</ng-template>

        <div class="row">
            <div class="col-md-6">
                <mat-form-field style="display:initial">
                    <mat-label>Nombres</mat-label>
                    <input matInput type="text" formControlName="sNombres" autocomplete="off">
                </mat-form-field>
            </div>

            <div class="col-md-6">
                <mat-form-field style="display:initial">
                    <mat-label>Apellidos</mat-label>
                    <input matInput type="text" formControlName="sApellidos" autocomplete="off">
                </mat-form-field>
            </div>
        </div>


        <div class="row">
            <!-- <div class="col-md-3">

                <ng-select placeholder="Tipo de Documento" appendTo="body" formControlName="nTipoDoc">
                    <ng-option *ngFor="let obj of lDocumentos" [value]="obj.valor">{{obj.nombre}}</ng-option>
                </ng-select>

            </div>
 -->
            <div class="col-md-12">
                <mat-form-field style="display:initial">
                    <mat-label>N° Documento</mat-label>
                    <input matInput type="text" formControlName="sNumDoc" autocomplete="off">
                </mat-form-field>
            </div>

            <!-- <div class="col-md-6">
                <mat-form-field style="display:initial">
                    <mat-label>Direccion</mat-label>
                    <input matInput type="text" formControlName="sNumDoc" autocomplete="off">
                </mat-form-field>
            </div> -->

        </div>


        <div class="row d-flex justify-content-center ">
            <button type="button" mat-button (click)="fnCerrarModal()">Cancelar</button>
            <button type="button" color="primary" mat-raised-button (click)="fnGrabar()">Grabar</button>
        </div>

    </form>

</div>
