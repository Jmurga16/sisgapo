<div class="header-app">
    <h1>Gestión de Zonas</h1>
</div>

<div class="fab-container">
    <div>
        <a routerLink="/zonas/agregar">
            <button matTooltipPosition="left" mat-raised-button mat-mini-fab class="fab-secondary" color="primary"
                matTooltip="Agregar"><span class="material-icons">add</span></button>
        </a>
    </div>
</div>

<div class="row">
    <div *ngFor="let item of lZonas" class="col-md-3" style="margin-bottom: 2rem;">
        <mat-card class="example-card" [class.zona-inactiva]="item.bEstado === false">
            <mat-card-title style="text-align: center;">{{item.sNombre}}</mat-card-title>
            <mat-card-subtitle style="text-align: center;">
                <span class="badge-estado" [class.badge-inactivo]="item.bEstado === false">{{item.sEstado}}</span>
            </mat-card-subtitle>
            <img mat-card-image [alt]="item.sNombre" class="tamanioImagen" [src]="item.sRutaImagen">
            <mat-card-actions>
                <button mat-raised-button color="accent" (click)="fnVerZona(item.nIdZona)">Editar</button>
                <button *ngIf="item.bEstado !== false" mat-raised-button color="warn"
                    (click)="fnCambiarEstado(item, false)">Dar de baja</button>
                <button *ngIf="item.bEstado === false" mat-raised-button color="primary"
                    (click)="fnCambiarEstado(item, true)">Activar</button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
