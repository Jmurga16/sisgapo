<section class="pagina-contenido zona-formulario-pagina">
<div class="header-app">
    <h1>{{sTitulo}}</h1>
</div>

<div class="zona-formulario-contenido">
    <mat-card class="example-card">
        <div class="divImagen">
            <img mat-card-image alt="Imagen previa" class="tamanioImagen" [src]="sRutaImagen">
        </div>
        <mat-card-content>
            <mat-form-field class="example-form-field inputDatos">
                <mat-label>Nombre</mat-label>
                <input matInput type="text" autocomplete="off" [formControl]="fNombre">
            </mat-form-field>
            <mat-form-field class="example-form-field inputDatos">
                <mat-label>Ruta de Imagen</mat-label>
                <input matInput type="text" autocomplete="off" [formControl]="fRutaImagen" (change)="changeImagen()">
            </mat-form-field>
        </mat-card-content>
        <div class="acciones-formulario">
            <button type="button" mat-button routerLink="/zonas">Cancelar</button>
            <button type="button" mat-raised-button color="primary" (click)="fnSaveNewZona()">
                <mat-icon>save</mat-icon>
                Guardar
            </button>
        </div>
    </mat-card>
</div>
</section>
