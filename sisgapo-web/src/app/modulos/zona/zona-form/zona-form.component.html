<div class="header-app" style="margin-top:1rem;">
    <h1 style=" font-weight: bold;">{{sTitulo}}</h1>
</div>

<!--Zona de botones flotantes-->
<div class="fab-container">
    <div>
        <!--Para Salir -->
        <a routerLink="/zonas">
            <button matTooltipPosition="left" mat-raised-button mat-mini-fab class="fab-secondary" color="warn"
                matTooltip="Salir"><span class="material-icons">close</span></button>
        </a>
    </div>
</div>


<div style="justify-content: center;align-items: center; display:flex;">

    <mat-card class="example-card ">
        
        <div class="divImagen">
            <img mat-card-image alt="Imagen Previa" class="tamanioImagen" src={{sRutaImagen}}>
        </div>

        <mat-card-content>

            <mat-form-field class="example-form-field inputDatos">
                <mat-label>Nombre</mat-label>
                <input matInput type="text" autocomplete="off" [formControl]="fNombre">
            </mat-form-field>

            <mat-form-field class="example-form-field inputDatos">
                <mat-label>Ruta de Imagen</mat-label>
                <input matInput type="text" autocomplete="off" [formControl]="fRutaImagen" (change)="changeImagen()">
            </mat-form-field>

        </mat-card-content>

        <mat-card-actions>

            <button *ngIf="!bEditar" mat-raised-button color="primary" style="width: 100%;" (click)="fnSaveNewZona()">Guardar</button>

        </mat-card-actions>
    </mat-card>

</div>
