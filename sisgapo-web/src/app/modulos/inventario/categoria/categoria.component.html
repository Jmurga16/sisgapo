<section class="pagina-contenido categoria-pagina" aria-labelledby="tituloCategorias">
    <div class="header-app">
        <h1 id="tituloCategorias">Categorías</h1>
    </div>

    <button class="fab-listado" mat-mini-fab color="primary" matTooltip="Agregar categoría"
        matTooltipPosition="left" aria-label="Agregar categoría" (click)="fnAbrirModal(0,0)"
        *ngIf="sesionService.fnPuedeGestionarInventario() && !configuracionService.bDemoSoloLectura">
        <mat-icon>add</mat-icon>
    </button>

    <div class="categoria-filtros">
        <mat-form-field appearance="outline">
            <mat-label>Buscar categoría</mat-label>
            <mat-icon matPrefix>search</mat-icon>
            <input matInput (input)="fnFiltrarTabla($event)" placeholder="Nombre o descripción" #input>
        </mat-form-field>
        <button class="boton-limpiar" mat-stroked-button type="button" (click)="fnLimpiarFiltro(input)">
            <mat-icon>filter_alt_off</mat-icon>
            Limpiar
        </button>
    </div>

    <div class="mat-elevation-z2 categoria-tabla">
        <div class="tabla-scroll tabla-5col tabla-tarjetas">
            <table mat-table [dataSource]="dsCategoria" matSort aria-describedby="tituloCategorias">
                <ng-container matColumnDef="nIdCategoria">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
                    <td mat-cell *matCellDef="let element" data-label="Código">{{element.nIdCategoria}}</td>
                </ng-container>
                <ng-container matColumnDef="sNombre">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
                    <td mat-cell *matCellDef="let element" data-label="Nombre" class="categoria-nombre">{{element.sNombre}}</td>
                </ng-container>
                <ng-container matColumnDef="sDescripcion">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
                    <td mat-cell *matCellDef="let element" data-label="Descripción">{{element.sDescripcion}}</td>
                </ng-container>
                <ng-container matColumnDef="sEstado">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
                    <td mat-cell *matCellDef="let element" data-label="Estado">
                        <span class="estado-registro" [class.estado-registro-inactivo]="element.sEstado === 'Inactivo'">
                            {{element.sEstado}}
                        </span>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Acciones">
                    <th mat-header-cell *matHeaderCellDef class="col-acciones">Acciones</th>
                    <td mat-cell *matCellDef="let element" class="col-acciones">
                        <div class="acciones"
                            *ngIf="sesionService.fnPuedeGestionarInventario() && !configuracionService.bDemoSoloLectura">
                            <button mat-raised-button color="accent"
                                (click)="fnAbrirModal(1,element.nIdCategoria)">Editar</button>
                            <button *ngIf="element.sEstado=='Activo'" mat-raised-button color="warn"
                                (click)="fnCambiarEstado(element.nIdCategoria,0)">Desactivar</button>
                            <button *ngIf="element.sEstado=='Inactivo'" mat-raised-button class="boton-activar"
                                (click)="fnCambiarEstado(element.nIdCategoria,1)">Activar</button>
                        </div>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell celda-sin-datos" colspan="5">
                        No se encontraron categorías con el filtro "{{input.value}}".
                    </td>
                </tr>
            </table>
        </div>
        <mat-paginator [pageSizeOptions]="[10, 25, 100]"></mat-paginator>
    </div>
</section>
