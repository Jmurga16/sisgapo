<h1 mat-dialog-title class="categoria-modal-titulo">{{sAccionModal}} categoría</h1>

<form class="categoria-form" [formGroup]="formCategoria" autocomplete="off" (ngSubmit)="fnGrabar()">
    <mat-dialog-content>
        <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>
            <input matInput type="text" formControlName="sNombre" maxlength="100" autocomplete="off">
            <mat-hint align="end">{{formCategoria.get('sNombre').value?.length || 0}}/100</mat-hint>
            <mat-error *ngIf="formCategoria.get('sNombre').hasError('required')">
                Ingrese el nombre de la categoría.
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Descripción</mat-label>
            <textarea matInput formControlName="sDescripcion" maxlength="250" rows="4"></textarea>
            <mat-hint align="end">{{formCategoria.get('sDescripcion').value?.length || 0}}/250</mat-hint>
            <mat-error *ngIf="formCategoria.get('sDescripcion').hasError('required')">
                Ingrese una descripción.
            </mat-error>
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions class="acciones-formulario" align="end">
        <button type="button" mat-button (click)="fnCerrarModal(0)" [disabled]="bGuardando">
            Cancelar
        </button>
        <button type="submit" mat-raised-button color="primary" [disabled]="bGuardando">
            <mat-icon>save</mat-icon>
            {{bGuardando ? 'Guardando…' : 'Guardar'}}
        </button>
    </mat-dialog-actions>
</form>
