<div>

    <h1 mat-dialog-title class="clstitulo">{{sAccionModal}} Categoría</h1>

    <form [formGroup]="formCategoria" ngNativeValidate autocomplete="off" name="Formulario" id="new-form">

        <div class="row" style="padding-bottom: 1rem;">
            <div class="col-md-12">
                <mat-form-field style="display:initial">
                    <mat-label>Nombre</mat-label>
                    <input matInput type="text" formControlName="sNombre" autocomplete="off" name="Nombre">
                </mat-form-field>
            </div>
           
        </div>

        <div class="row">

            <div class="col-md-12">
                <mat-form-field style="display:initial">
                    <mat-label>Descripción</mat-label>
                    <textarea matInput placeholder="Descripcion" formControlName="sDescripcion" name="Descripcion" ></textarea>
                </mat-form-field>
            </div>

        </div>

        <div class="row" style="padding-top: 1rem;">

            <div class="col-md-6">
                <button type="button" color="primary" style="width: 100%;" mat-raised-button
                    (click)="fnGrabar()">Grabar</button>
            </div>

            <div class="col-md-6">
                <button type="button" color="warn" style="width: 100%;" mat-raised-button
                    (click)="fnCerrarModal(0)">Cancelar</button>
            </div>

        </div>
    </form>

</div>
