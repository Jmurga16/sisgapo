<section class="pagina-contenido" aria-labelledby="tituloAlmacenes">
<div class="header-app">
    <h1 id="tituloAlmacenes">Gestión de {{appName}}</h1>
</div>

<button class="fab-listado" mat-mini-fab color="primary" matTooltip="Agregar almacén"
    matTooltipPosition="left" aria-label="Agregar almacén" (click)="fnAbrirModal(0,0)"
    *ngIf="!configuracionService.bDemoSoloLectura">
    <mat-icon>add</mat-icon>
</button>

<div class="barra-filtros row">
    <div class="col-md-6">
        <mat-form-field appearance="outline">
            <mat-label>Filtro</mat-label>
            <input matInput (input)="applyFilter($event)" placeholder="Buscar" #input>
        </mat-form-field>
    </div>
    <div class="col-md-6 barra-filtros-botones">
        <button class="boton-limpiar" mat-stroked-button type="button" (click)="fnLimpiarFiltro(input)">
            <mat-icon>filter_alt_off</mat-icon>
            Limpiar
        </button>
    </div>
</div>

<div class="mat-elevation-z8">
    <div class="tabla-scroll tabla-5col">
        <table mat-table [dataSource]="dsAlmacenes" matSort aria-describedby="tituloAlmacenes">
            <ng-container matColumnDef="nIdAlmacen">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="col-codigo" id="IdAlmacen"> Código </th>
                <td mat-cell *matCellDef="let element"> {{element.nIdAlmacen}} </td>
            </ng-container>

            <ng-container matColumnDef="sNombreZona">
                <th mat-header-cell *matHeaderCellDef mat-sort-header id="Zona"> Zona </th>
                <td mat-cell *matCellDef="let element"> {{element.sNombreZona}} </td>
            </ng-container>

            <ng-container matColumnDef="sNombreAlmacen">
                <th mat-header-cell *matHeaderCellDef mat-sort-header id="Almacen"> Almacén </th>
                <td mat-cell *matCellDef="let element"> {{element.sNombreAlmacen}} </td>
            </ng-container>

            <ng-container matColumnDef="sEstado">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="col-estado" id="Estado"> Estado </th>
                <td mat-cell *matCellDef="let element">
                    <span class="estado-registro" [class.estado-registro-inactivo]="element.sEstado === 'Inactivo'">
                        {{element.sEstado}}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="Acciones">
                <th mat-header-cell *matHeaderCellDef class="col-acciones" id="Accion"> Acciones </th>
                <td mat-cell *matCellDef="let element" class="col-acciones">
                    <div class="acciones" *ngIf="!configuracionService.bDemoSoloLectura">
                        <button mat-raised-button color="accent"
                            (click)="fnAbrirModal(1,element.nIdAlmacen)">Editar</button>
                        <button *ngIf="element.sEstado=='Activo'" mat-raised-button color="warn"
                            (click)="fnCambiarEstado(element.nIdAlmacen,0)">Desactivar</button>
                        <button *ngIf="element.sEstado=='Inactivo'" mat-raised-button class="boton-activar"
                            (click)="fnCambiarEstado(element.nIdAlmacen,1)">Activar</button>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell celda-sin-datos" colspan="5">
                    {{ input.value
                        ? 'No se encontraron almacenes con el filtro "' + input.value + '"'
                        : 'No hay almacenes registrados.' }}
                </td>
            </tr>
        </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 25, 100]"></mat-paginator>
</div>
</section>
