<!--Titulo-->
<div class="header-app" style="margin-top:1rem;">
    <h1 style=" font-weight: bold;">Gestión de {{appName}}</h1>
</div>

<!--Filtrar y Agregar -->
<div class="form row">
<!--Filtro-->
    <div class="col-md-6">
        <mat-form-field appearance="standard" style="width: 90%;">
            <mat-label>Filtro</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Buscar" #input>
        </mat-form-field>
    </div>
    <!--Botón agregar-->
    <div class="col-md-1">
        <div class="example-button-row botones ">
            <button mat-raised-button color="primary" (click)="fnAbrirModal(0,0)">Agregar</button>
        </div>
    </div>
</div>

<!--Tabla de Almacenes-->
<div class="mat-elevation-z8">

    <table mat-table [dataSource]="dsAlmacenes" matSort aria-describedby="TablaAlmacenes" >
        
        <!-- Codigo -->
        <ng-container matColumnDef="nIdAlmacen">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaId" id="IdAlmacen"> Codigo </th>
            <td mat-cell *matCellDef="let element"> {{element.nIdAlmacen}} </td>
        </ng-container>

        <!-- Nombre -->
        <ng-container matColumnDef="sNombreZona">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaZona" id="Zona"> Zona </th>
            <td mat-cell *matCellDef="let element"> {{element.sNombreZona}} </td>
        </ng-container>

        <!-- Rol -->
        <ng-container matColumnDef="sNombreAlmacen">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaZona" id="Almacen"> Almacen </th>
            <td mat-cell *matCellDef="let element"> {{element.sNombreAlmacen}} </td>
        </ng-container>

        <!-- Estado -->
        <ng-container matColumnDef="sEstado">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaId" id="Estado"> Estado </th>
            <td mat-cell *matCellDef="let element"> {{element.sEstado}} </td>
        </ng-container>

        <!--Acciones-->
        <ng-container matColumnDef="Acciones">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="clsColumnaAcciones" id="Accion"> Acciones </th>
            <td mat-cell *matCellDef="let element">
                <div class="example-button-row ">
                    <button mat-raised-button color="accent" style="margin-right: 8px;"
                        (click)="fnAbrirModal(1,element.nIdAlmacen)">Editar</button>
                    <button *ngIf="element.sEstado=='Activo'" mat-raised-button color="warn"
                        (click)="fnCambiarEstado(element.nIdAlmacen,0)">Eliminar</button>
                    <button *ngIf="element.sEstado=='Inactivo'" mat-raised-button class="buttonActive"
                        (click)="fnCambiarEstado(element.nIdAlmacen,1)">Activar</button>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No se encontraron datos con el filtro "{{input.value}}"</td>
        </tr>
    </table>
    <!--Mat Paginator-->
    <mat-paginator [pageSizeOptions]="[10, 25, 100]"></mat-paginator>
</div>
