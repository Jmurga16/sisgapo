name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisgapo-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SISGAPO_Back.sln
      - run: dotnet build SISGAPO_Back.sln --configuration Release --no-restore
      - run: dotnet test Test/Test.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"


  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Levantar SQL Server y cargar el esquema
        run: |
          docker compose up -d db
          docker compose up db-init
          test "$(docker inspect -f '{{.State.ExitCode}}' sisgapo-db-init)" = "0"
      - name: Pruebas de integracion
        working-directory: sisgapo-api
        env:
          SISGAPO_TEST_CONNECTION_STRING: Server=localhost,14330;Database=DB_SISGAPO;User ID=sa;Password=Sisgapo!Demo2026;TrustServerCertificate=True
        run: dotnet test Test/Test.csproj --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisgapo-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sisgapo-web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
