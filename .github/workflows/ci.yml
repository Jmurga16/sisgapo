name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisgapo-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SISGAPO_Back.sln
      - run: dotnet build SISGAPO_Back.sln --configuration Release --no-restore
      - run: dotnet test Test/Test.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisgapo-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sisgapo-web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
