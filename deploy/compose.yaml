name: sisgapo-demo

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    <<: *logs
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Falta en .env}
      MSSQL_MEMORY_LIMIT_MB: '2048'
      TZ: America/Lima
    volumes:
      - sql-data:/var/opt/mssql
    mem_limit: 2560m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles:
      - sembrar
    environment:
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Falta en .env}
      SISGAPO_APP_PASSWORD: ${SISGAPO_APP_PASSWORD:?Falta en .env}
    volumes:
      - ../sisgapo-docs/sql:/sql:ro
      - ../docker/init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *logs
    build: ../sisgapo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: 'true'
      SISGAPO_CONNECTION_STRING: Server=db;Database=DB_SISGAPO;User ID=sisgapo_app;Password=${SISGAPO_APP_PASSWORD:?Falta en .env};Encrypt=True;TrustServerCertificate=True
      SISGAPO_JWT_KEY: ${SISGAPO_JWT_KEY:?Falta en .env}
      Cors__OrigenesPermitidos__0: https://${SITE_HOST:?Falta en .env}
      TZ: America/Lima
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - sisgapo-api
    mem_limit: 512m
    restart: unless-stopped

  web:
    <<: *logs
    build: ../sisgapo-web
    environment:
      API_UPSTREAM: sisgapo-api:8080
    depends_on:
      - api
    networks:
      default: {}
      edge:
        aliases:
          - sisgapo-web
    mem_limit: 128m
    restart: unless-stopped

networks:
  edge:
    external: true

volumes:
  sql-data:
